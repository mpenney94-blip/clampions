name: League dashboard

on:
  schedule:
    - cron: "0 15 * * 2"  # Tuesdays 11am ET, after Monday night's game is final
    - cron: "0 15 * * 4"  # Thursdays, to pick up Sleeper's stat corrections
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**", "sleeper.py", "winprob.py", ".github/workflows/dashboard.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEAGUE_ID: "1387868351270760448"  # We Are The Clampions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Anthropic SDK (for the written columns)
        run: pip install anthropic
      - name: Restore finished seasons
        uses: actions/cache@v4
        with:
          path: _past
          # finished seasons never change, so they're rebuilt only when the code or the current league does
          key: past-${{ env.LEAGUE_ID }}-${{ hashFiles('dashboard/**', 'winprob.py', 'sleeper.py') }}
      - name: Build site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: without it the built-in writer does the trash talk
        run: python -m dashboard.build "$LEAGUE_ID" --out _site --past-cache _past
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
