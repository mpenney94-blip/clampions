name: League dashboard

on:
  schedule:
    - cron: "0 15 * * 2"  # Tuesdays 11am ET, after Monday night's game is final
    - cron: "0 15 * * 4"  # Thursdays, to pick up Sleeper's stat corrections
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**", "sleeper.py", "winprob.py", ".github/workflows/dashboard.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEAGUE_ID: "1387868351270760448"  # We Are The Clampions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python -m dashboard.build "$LEAGUE_ID" --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
